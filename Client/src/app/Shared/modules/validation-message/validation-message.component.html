<div *ngIf="entityForm.controls[fieldName] && entityForm.controls[fieldName].invalid && entityForm.controls[fieldName].touched">
    <div *ngFor="let validation of validationMessages[fieldName]">
      <small *ngIf="entityForm.controls[fieldName]?.errors?.[validation.type]" class="p-error">
        {{ validation.message }}
      </small>
    </div>
  </div>
