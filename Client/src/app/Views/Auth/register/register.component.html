<div class="flex  justify-center  mt-10 ">
    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-md min-h-[500px] " >
      <h2 class="text-2xl font-semibold text-center mb-6">Register</h2>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label for="firstName" class="block text-sm font-medium text-gray-700">firstName</label>
          <input id="firstName" type="text" formControlName="firstName" class="w-full p-2 mt-2 border rounded-md" />
          <app-validation-message [entityForm]="loginForm" fieldName="firstName"
              [validationMessages]="validationMessages">
            </app-validation-message>
        </div> 
        
        <div class="mb-4">
            <label for="lastName" class="block text-sm font-medium text-gray-700">lastName</label>
            <input id="lastName" type="text" formControlName="lastName" class="w-full p-2 mt-2 border rounded-md" />
            <app-validation-message [entityForm]="loginForm" fieldName="lastName"
                [validationMessages]="validationMessages">
              </app-validation-message>
        </div>

        <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700">email</label>
            <input id="email" type="text" formControlName="email" class="w-full p-2 mt-2 border rounded-md" />
            <app-validation-message [entityForm]="loginForm" fieldName="email"
                [validationMessages]="validationMessages">
              </app-validation-message>
        </div>

        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input id="password" type="password" formControlName="password" class="w-full p-2 mt-2 border rounded-md" />
          <app-validation-message [entityForm]="loginForm" fieldName="password"
              [validationMessages]="validationMessages">
            </app-validation-message>
        </div>
  
        <div class="mb-6 flex justify-between items-center">
          <button type="submit" [disabled]="loginForm.invalid || loading" class="w-full p-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none" [class.opacity-50]="loading">
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>
        </div>
      </form>
    </div>
  </div>
