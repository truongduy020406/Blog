<div class="flex  justify-center  mt-10 ">
  <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-md h-96 " >
    <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input id="username" type="text" formControlName="username" class="w-full p-2 mt-2 border rounded-md" />
        <app-validation-message [entityForm]="loginForm" fieldName="username"
            [validationMessages]="validationMessages">
          </app-validation-message>
        <!-- <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-red-500 text-sm">
          Username is required.
        </div> -->
      </div>  

      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input id="password" type="password" formControlName="password" class="w-full p-2 mt-2 border rounded-md" />
        <app-validation-message [entityForm]="loginForm" fieldName="password"
            [validationMessages]="validationMessages">
          </app-validation-message>
        <!-- <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-sm">
          Password is required.
        </div> -->
      </div>

      <div class="mb-6 flex justify-between items-center">
        <button type="submit" [disabled]="loginForm.invalid || loading" class="w-full p-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none" [class.opacity-50]="loading">
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </div>
    </form>
  </div>
</div>
