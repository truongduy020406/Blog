<form class="form-horizontal form-label-left" [formGroup]="form" (ngSubmit)="saveChange()">
  <p-panel #pnlDetail header="Thông tin" [toggleable]="true" [collapsed]="false">
    <div class="formgrid grid">
      <!-- Tiêu đề -->
      <div class="field col-12 md:col-6">
        <label for="title" class="block text-sm font-medium text-gray-700">
          Tiêu đề <span class="text-red-500">*</span>
        </label>
        <input
          id="title"
          type="text"
          class="mt-1 block w-full border border-black rounded-sm p-1 "
          [pKeyFilter]="noSpecial"
          formControlName="name"
          (keyup)="generateSlug()"
        />
        <app-validation-message [entityForm]="form" fieldName="name" [validationMessages]="validationMessages"></app-validation-message>
      </div>

      <!-- Slug -->
      <div class="field col-12 md:col-6">
        <label for="slug" class="block text-sm font-medium text-gray-700">
          Slug <span class="text-red-500">*</span>
        </label>
        <input
          id="slug"
          type="text"
          class="mt-1 block w-full border border-black rounded-sm p-1 "
          [pKeyFilter]="noSpecial"
          formControlName="slug"
        />
        <app-validation-message [entityForm]="form" fieldName="slug" [validationMessages]="validationMessages"></app-validation-message>
      </div>

      <!-- Mô tả ngắn -->
      <div class="field col-12">
        <label for="description" class="block text-sm font-medium text-gray-700">
          Mô tả ngắn <span class="text-red-500">*</span>
        </label>
        <textarea
          id="description"
          rows="4"
          class="mt-1 block w-full border border-black rounded-sm p-1 "
          formControlName="description"
        ></textarea>
        <app-validation-message [entityForm]="form" fieldName="description" [validationMessages]="validationMessages"></app-validation-message>
      </div>

      <!-- Hình ảnh -->
      <div class="field col-12 md:col-6">
        <label for="thumbnailFileContent" class="block text-sm font-medium text-gray-700">
          Hình ảnh <span class="text-red-500">*</span>
        </label>
        <input type="hidden" formControlName="thumbnail" />
        <input
          (change)="onFileChange($event)"
          type="file"
          class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
        />
      </div>

      <!-- Hình ảnh xem trước -->
      <div *ngIf="thumbnailImage" class="field col-12 md:col-6">
        <p-image [src]="thumbnailImage" [preview]="true" [alt]="selectedEntity.name" width="250"></p-image>
      </div>

      <!-- Nội dung -->
      <div class="field col-12">
        <label for="content" class="block text-sm font-medium text-gray-700">Nội dung</label>
        <p-editor formControlName="content" [style]="{ height: '320px' }"></p-editor>
      </div>

      <!-- Mô tả SEO -->
      <div class="field col-12">
        <label for="seoDescription" class="block text-sm font-medium text-gray-700">Mô tả SEO</label>
        <textarea
          id="seoDescription"
          rows="4"
          class="mt-1 block w-full border border-black rounded-sm p-1 "
          [pKeyFilter]="noSpecial"
          formControlName="seoDescription"
        ></textarea>
      </div>

      <!-- Checkbox Kích hoạt -->
      <div class="field-checkbox col-12 md:col-3 flex items-center">
        <p-checkbox formControlName="isActive" [binary]="true" 
        id="isActive" class="mr-2 border border-black rounded-md mt-2">
      </p-checkbox>
        <label for="isActive" class="text-sm font-medium text-gray-700 mt-2">Kích hoạt</label>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <button
        type="submit"
        class="px-4 py-2 bg-blue-600 text-white font-medium text-sm rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        [disabled]="!form.valid || btnDisabled"
      >
        Lưu
      </button>
    </ng-template>

    <p-blockUI [target]="pnlDetail" [blocked]="blockedPanelDetail">
      <p-progressSpinner
        [style]="{ width: '100px', height: '100px', position: 'absolute', top: '25%', left: '50%' }"
        strokeWidth="2"
        animationDuration=".5s"
      ></p-progressSpinner>
    </p-blockUI>
  </p-panel>
</form>
