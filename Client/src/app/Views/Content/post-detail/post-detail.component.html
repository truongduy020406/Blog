<div class="container mx-auto p-4">
    <!-- Card hiển thị chi tiết bài viết -->
    <p-card class="mb-4">
      <ng-template pTemplate="header">
        <h1 class="text-2xl font-bold">{{ dataPost?.name }}</h1>
      </ng-template>
      <ng-template pTemplate="title">
        <span class="text-gray-600">Category: </span>
        <span class="text-blue-500">{{ dataPost?.categoryName }}</span>
      </ng-template>
      <ng-template pTemplate="subtitle">
        <div class="text-sm text-gray-500">
          By <span class="font-semibold">{{ dataPost?.authorName }}</span> on {{ dataPost?.dateCreated | date:'medium' }}
        </div>
      </ng-template>

      <div class="mt-4" [innerHTML]="dataPost?.content">
    </div>
      <ng-template pTemplate="footer">
        <div class="flex justify-between mt-4">
          <div class="text-sm text-gray-500">
            <span>Views: {{ dataPost?.viewCount }}</span>
          </div>
          <div>
            <button pButton type="button" label="Share" class="p-button-secondary mr-2"></button>
            <button pButton type="button" label="Bookmark" class="p-button-outlined"></button>
          </div>
        </div>
      </ng-template>
    </p-card>
  
    <!-- Thông tin SEO -->
    <div class="bg-gray-100 p-4 rounded-md">
      <h2 class="text-lg font-semibold mb-2">SEO Information</h2>
      <p><strong>Description:</strong> {{ dataPost?.seoDescription }}</p>
      <p><strong>Tags:</strong> {{ dataPost?.tags }}</p>
    </div>
  </div>
