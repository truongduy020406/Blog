<div class="container mx-auto p-4 max-w-screen-xl">
    <!-- Card hiển thị chi tiết bài viết -->
    <p-card class="mb-4">
      <!-- <img alt="Card" class="w-44 h-44" [src]="dataQuestion?.thumbnail" /> -->
      <ng-template pTemplate="header">
        <span class="text-2xl font-bold p-4">{{ dataQuestion?.title }}</span>
      </ng-template>
      <ng-template pTemplate="subtitle">
        <div class="text-sm text-gray-500">
          By <span class="font-semibold">{{ dataQuestion?.userName }}</span> on
          {{ dataQuestion?.createdAt | date : "medium" }}
        </div>
   
      </ng-template>
  
      <div
        style="
          overflow-wrap: break-word;
          word-break: break-word;
          white-space: normal;
        "
      >
        <markdown [data]="dataQuestion?.content"></markdown>
      </div>
  
      <ng-template pTemplate="footer"> </ng-template>
    </p-card>
  </div>
